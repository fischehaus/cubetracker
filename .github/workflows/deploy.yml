# Auto-Deploy zu Coolify (Hetzner).
#
# Loest den Monorepo-Dedup des generischen Coolify-Source-Webhooks ab: triggert
# GEZIELT die App(s), deren Dateien sich geaendert haben, ueber Coolifys
# per-App-Deploy-API. So gilt verlaesslich "push = live".
#
# Voraussetzungen (einmalig):
#   - Coolify: Settings -> Advanced -> "API Access" aktiviert (Allowed IPs offen).
#   - GitHub: Repo-Secret COOLIFY_TOKEN = Coolify-API-Token (Keys & Tokens).
#
# Manueller Test: Actions-Tab -> "Deploy to Coolify" -> "Run workflow"
# (oder `gh workflow run deploy.yml --ref feature/W-api-prefix`) -> deployt beide.
name: Deploy to Coolify

on:
  push:
    branches: [feature/W-api-prefix]
  workflow_dispatch: {}

concurrency:
  group: coolify-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Test-Gate (W.ops-hardening, 2026-06-12): pytest + tsc + vitest MUESSEN
  # gruen sein, bevor irgendetwas deployt wird. Vorher ging jeder Push
  # ungetestet live — 245 existierende Tests hielten nichts auf.
  # Beide Suiten laufen ohne Infrastruktur (SQLite-Temp-DB / happy-dom).
  test:
    runs-on: ubuntu-latest
    # QA W.ops-hardening: ohne Timeout blockiert ein haengender npm ci/pytest
    # den Concurrency-Slot (cancel-in-progress: false) fuer alle Folge-Pushes.
    timeout-minutes: 15
    # W.ci-postgres-lock (2026-09-25): echtes Postgres (wie Prod: 16) fuer den
    # Start-Smoke-Test unten. pytest bleibt auf SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ct
          POSTGRES_PASSWORD: ct
          POSTGRES_DB: ct
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ct"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            webapp/pyproject.toml
            webapp/constraints.txt

      - name: Backend-Tests (pytest, SQLite)
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -c webapp/constraints.txt "./webapp[dev]"
          cd webapp && python -m pytest -q

      # Lesson 2026-09-25: Der Crash (SQLAlchemy 2.1 -> psycopg v3) passierte
      # beim App-Import gegen Postgres — pytest (SQLite, ohne Lifespan) sah ihn
      # nicht. Hier startet die App ZWEIMAL echt gegen Postgres (Lifespan:
      # create_all, Mini-Migrationen, Seeds; 2. Lauf prueft Idempotenz).
      # Faellt durch bei Import-Fehler, /api/health != ok oder "WARN:" im Log.
      - name: Backend-Start-Smoke (Postgres, Lifespan)
        env:
          DATABASE_URL: postgresql://ct:ct@localhost:5432/ct
          JWT_SECRET: ci-smoke-secret-ci-smoke-secret-ci-smoke-secret
        run: |
          set +e  # Exit-Code selbst auswerten, damit das Log immer erscheint
          cd webapp
          for run in 1 2; do
            python - > "smoke-$run.log" 2>&1 <<'PY'
          from fastapi.testclient import TestClient
          import main
          with TestClient(main.app) as c:
              r = c.get("/api/health")
              print("HEALTH", r.status_code, r.text)
              assert r.status_code == 200 and r.json().get("status") == "ok"
          PY
            rc=$?
            cat "smoke-$run.log"
            [ "$rc" -eq 0 ] || { echo "Smoke-Lauf $run: App-Start fehlgeschlagen"; exit 1; }
            if grep -q "WARN:" "smoke-$run.log"; then echo "Smoke-Lauf $run: WARN im Lifespan"; exit 1; fi
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Frontend-Tests (tsc + vitest)
        run: |
          cd webapp/frontend
          npm ci --no-audit --no-fund
          npx tsc -b
          npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Geaenderte Bereiche erkennen
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manueller Lauf -> Frontend + Backend deployen."
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.before }}"
          # BASE muss ein existierender Commit sein (bei Multi-Commit-Pushes
          # oder Force-Pushes ggf. nicht vorhanden) - sonst Fallback.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BASE" HEAD)"
          else
            CHANGED="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          fi
          echo "Geaenderte Dateien:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -q '^webapp/frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          fi
          # Backend nur bei echten Backend-Code-Aenderungen unter webapp/
          # (nicht frontend/, nicht .md-Docs) -> keine unnoetigen Backend-Deploys.
          if echo "$CHANGED" | grep -E '^webapp/' | grep -qvE '^webapp/frontend/|\.md$'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Frontend deployen
        if: steps.changes.outputs.frontend == 'true'
        run: |
          echo "Triggere Frontend-Deploy ..."
          curl -fsS -X GET \
            "http://178.105.103.78:8000/api/v1/deploy?uuid=pcixgncs671tifdx9e3rxr7h&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Backend deployen
        if: steps.changes.outputs.backend == 'true'
        run: |
          echo "Triggere Backend-Deploy ..."
          curl -fsS -X GET \
            "http://178.105.103.78:8000/api/v1/deploy?uuid=w3dw05zc8nv2izxa3v2qi911&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Nichts zu deployen
        if: steps.changes.outputs.frontend != 'true' && steps.changes.outputs.backend != 'true'
        run: echo "Keine App-relevanten Aenderungen (z.B. nur Docs/.claude) -> kein Deploy noetig."

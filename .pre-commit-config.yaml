repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      # backlog#8 (2026-11-07): ungültiges JSON (z. B. Locale mit unescaptem
      # Anführungszeichen, W.i18n-jsonfix-qa) vor dem Commit abfangen.
      # tsconfig*.json sind JSONC (Kommentare) → ausgenommen.
      - id: check-json
        exclude: (^|/)tsconfig[^/]*\.json$

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3
        files: ^backend/.*\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/.*\.py$

# Security-Header (W.ops-hardening, 2026-06-12) — als Snippet, weil nginx
# add_header-Direktiven aus dem server-Block NICHT vererbt, sobald eine
# location ein eigenes add_header hat (z.B. Cache-Control). Darum wird das
# Snippet im server-Block UND in jeder location mit eigenem add_header
# included. "always" = auch auf 4xx/5xx-Responses setzen.
#
# CSP-Begruendung (alle Quellen am Code verifiziert, 2026-06-12):
#   - script-src 'self':   Vite-Bundle + Chunks, kein Inline-Script in index.html
#   - style-src 'unsafe-inline': React-Inline-styles (Timer-Font-Scale,
#                          Virtualizer-Transforms) brauchen das
#   - img-src *.worldcubeassociation.org: WCA-Avatare (avatar_thumb_url aus
#                          der WCA-API); data: fuer CSS-eingebettete SVGs
#   - connect-src 'self':  alle API-Calls laufen ueber /api (same-origin),
#                          WCA/Nominatim proxyt das Backend
#   - frame-ancestors 'none': App darf nirgends eingebettet werden (Clickjacking)
# Die CSP ist der wichtigste kompensierende Schutz dafuer, dass das
# Access-Token bewusst in localStorage liegt (XSS-Exfiltration erschweren).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.worldcubeassociation.org; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# HSTS: TLS terminiert Traefik, der Header laeuft durch. Ohne includeSubDomains
# (Coolify-/Tooling-Subdomains sollen nicht mit-erzwungen werden).
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# microphone=(self): W.stackmat braucht getUserMedia(audio) fürs Stackmat-
# Klinken-Signal — `microphone=()` würde den Zugriff im Browser hart blocken.
# Kamera/Geolocation bleiben aus; bluetooth bewusst NICHT gelistet (Smart-Cube
# über Web Bluetooth muss weiter funktionieren).
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

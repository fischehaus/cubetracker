server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API intern ans Backend weiterreichen. proxy_pass OHNE Pfad/Slash ->
    # der volle /api/...-Pfad bleibt erhalten (KEIN Strip), das Backend
    # serviert /api/* nativ (Phase W.api-prefix). Host = stabiler
    # Coolify-Netzwerk-Alias des Backends.
    location /api/ {
        proxy_pass http://cubetracker-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: alle anderen Pfade auf index.html (Client-seitiges Routing,
    # z.B. /verify-email, /reset-password).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

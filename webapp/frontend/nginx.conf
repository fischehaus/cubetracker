server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API intern ans Backend weiterreichen. Variable in proxy_pass + resolver
    # erzwingen Laufzeit-DNS via Docker-DNS (127.0.0.11) -> nginx folgt der
    # Backend-IP auch nach Redeploys (sonst 502 durch gecachte alte IP).
    # proxy_pass mit Variable OHNE URI -> voller /api/...-Pfad bleibt (KEIN Strip),
    # das Backend serviert /api/* nativ. Host = stabiler Coolify-Netzwerk-Alias.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cbe http://cubetracker-backend:8000;
        proxy_pass $cbe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: alle anderen Pfade auf index.html (Client-seitiges Routing,
    # z.B. /verify-email, /reset-password).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security-Header global (gilt auch fuer /api/-Proxy-Responses).
    # WICHTIG: jede location mit eigenem add_header muss das Snippet
    # erneut includen (nginx-Vererbungsregel) — siehe Snippet-Kommentar.
    include /etc/nginx/snippets/cubetracker-security-headers.conf;

    # API intern ans Backend weiterreichen. Variable in proxy_pass + resolver
    # erzwingen Laufzeit-DNS via Docker-DNS (127.0.0.11) -> nginx folgt der
    # Backend-IP auch nach Redeploys (sonst 502 durch gecachte alte IP).
    # proxy_pass mit Variable OHNE URI -> voller /api/...-Pfad bleibt (KEIN Strip),
    # das Backend serviert /api/* nativ. Host = stabiler Coolify-Netzwerk-Alias.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cbe http://cubetracker-backend:8000;
        proxy_pass $cbe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite-Assets sind content-gehasht (index-Cxxxx.js) -> 1 Jahr immutable
    # cachen. Vorher: nur ETag-Heuristik, Browser revalidierte das 1,3-MB-
    # Bundle bei jedem Besuch (W.ops-hardening, 2026-06-12).
    location /assets/ {
        include /etc/nginx/snippets/cubetracker-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service-Worker: nie cachen, sonst haengen Clients auf alten Versionen.
    location = /sw.js {
        include /etc/nginx/snippets/cubetracker-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: alle anderen Pfade auf index.html (Client-seitiges Routing,
    # z.B. /verify-email, /reset-password). no-cache auf index.html ist
    # Pflicht: stale HTML wuerde nach einem Deploy auf geloeschte alte
    # Chunks zeigen (-> White-Screen). Gilt hier auch fuer manifest/icons
    # (klein, 304-Revalidierung ist ok).
    location / {
        include /etc/nginx/snippets/cubetracker-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

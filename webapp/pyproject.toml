[project]
name = "cubetracker-webapp"
version = "2.0.0a0"
description = "Multi-User-Web-Variante von cubetracker (Phase W)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "psycopg2-binary>=2.9",  # PostgreSQL-Driver fuer prod
    "passlib[bcrypt]>=1.7",  # Password-Hashing
    "python-jose[cryptography]>=3.3",  # JWT
    "python-multipart>=0.0.9",  # FormData (login-Form)
    "email-validator>=2.0",  # EmailStr-Validierung
    "slowapi>=0.1.9",  # Rate-Limiting (Brute-Force-Schutz auf /login + /register)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",  # FastAPI-Test-Client
]

[tool.setuptools]
packages = [
    "api",
    "auth",
    "db",
    "achievements",
    "challenges",
    "stats",
    "backup",
    "importers",
    "exporters",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

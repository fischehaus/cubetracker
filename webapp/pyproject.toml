[project]
name = "cubetracker-webapp"
version = "2.0.0a0"
description = "Multi-User-Web-Variante von cubetracker (Phase W)"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "psycopg2-binary>=2.9",  # PostgreSQL-Driver fuer prod
    "passlib[bcrypt]>=1.7",  # Password-Hashing
    "python-jose[cryptography]>=3.3",  # JWT
    "python-multipart>=0.0.9",  # FormData (login-Form)
    "email-validator>=2.0",  # EmailStr-Validierung
    "slowapi>=0.1.9",  # Rate-Limiting (Brute-Force-Schutz auf /login + /register)
    "resend>=2.0",  # Email-Versand fuer Password-Reset + Email-Verification (W.8)
    "httpx>=0.27",  # Async HTTP-Client fuer WCA-API + Nominatim-Geocoding (W.wca-comps)
    "feedparser>=6.0",  # RSS-Parser fuer News-Aggregator (W.news)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",  # FastAPI-Test-Client
]

[tool.setuptools]
packages = [
    "api",
    "auth",
    "db",
    "achievements",
    "challenges",
    "stats",
    "backup",
    "importers",
    "exporters",
    "emailing",
    # W.9+ Friend-System / W.10 Leaderboards / Hardware-Seed / Patch-Notes
    "friends",
    "leaderboard",
    "seeds",
    "changelog",
    "wca",  # W.wca-comps: WCA-API-Client + Geocoding + Endpoint
    "news",  # W.news: RSS-Aggregator + Endpoint
    "services",  # W.live-tests: GitHub-API-Client fuer Auto-Issue
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

# Render.com Blueprint — cubetracker-webapp (Phase W.7).
#
# Definiert in einem Rutsch:
#   - cubetracker-db: PostgreSQL Free-Tier (1 GB, ⚠️ 90-Tage-Limit)
#   - cubetracker-webapp: FastAPI-Backend (Free-Tier, Cold-Starts nach 15min Idle)
#   - cubetracker-frontend: Vite-React-Static-Site (Free-Tier, KEINE Cold-Starts)
#
# Deploy via Render-Dashboard:
#   1. New + → Blueprint
#   2. GitHub-Repo verbinden (fischehaus/cubetracker)
#   3. Branch: feature/W-multi-user-web
#   4. Blueprint Path: webapp/render.yaml
#   5. Render erkennt diese render.yaml automatisch
#   6. Apply → Render baut + provisioniert
#
# Webapp-Code lebt unter `webapp/` im Repo. `rootDir` weist Render an,
# nur diesen Subordner zu bauen (Build/Start-Commands relativ dazu).

databases:
  - name: cubetracker-db
    plan: free
    databaseName: cubetracker
    user: cubetracker
    # postgresMajorVersion: weglassen → Render-Default (aktuell 16)

services:
  # ============================================================
  # Backend — FastAPI
  # ============================================================
  - type: web
    name: cubetracker-webapp
    runtime: python
    plan: free
    rootDir: webapp
    # `pip install .` baut aus pyproject.toml (kein editable-mode in Prod).
    buildCommand: pip install .
    # $PORT setzt Render automatisch. host=0.0.0.0 ist Pflicht (sonst
    # listet uvicorn nur auf localhost).
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true  # bei Push auf den Branch automatisch neu deployen
    envVars:
      # Python-Version explizit. pyproject.toml sagt >=3.12;
      # 3.12.x ist Render-stabil unterstuetzt.
      - key: PYTHON_VERSION
        value: 3.12.7
      # Production-Mode: aktiviert require_strong_secret() +
      # Cookie secure-Flag + alembic-Upgrade.
      - key: CUBETRACKER_PROD
        value: "1"
      # JWT-Secret: Render generiert einen kryptografisch starken Wert
      # und persistiert ihn ueber Deploys. NIE im Repo, NIE im Log.
      - key: JWT_SECRET
        generateValue: true
      # DATABASE_URL kommt automatisch aus der oben definierten DB
      # (Render setzt postgresql://...).
      - key: DATABASE_URL
        fromDatabase:
          name: cubetracker-db
          property: connectionString
      # CORS-Origins fuer das Frontend. Comma-separated unterstuetzt
      # (siehe main.py). Default: die Render-Frontend-URL. Falls Render
      # einen Suffix an die Subdomain haengt, hier im Dashboard editieren.
      # Spaeter ergaenzbar um eigene Subdomain (z.B. cubetracker.iiiiii.org).
      - key: WEBAPP_FRONTEND_ORIGIN
        value: https://cubetracker-frontend.onrender.com

  # ============================================================
  # Frontend — Vite/React Static Site
  # ============================================================
  - type: web
    name: cubetracker-frontend
    runtime: static
    rootDir: webapp/frontend
    buildCommand: npm install && npm run build
    # Vite baut nach dist/ (relativ zu rootDir).
    staticPublishPath: ./dist
    # SPA-Routing: alle Pfade auf index.html rewriten.
    # (Wir haben aktuell nur eine Route, aber Future-Proof.)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
    envVars:
      # Backend-URL ins Build-Bundle kompilieren. Vite ersetzt
      # import.meta.env.VITE_API_BASE zur Build-Zeit.
      - key: VITE_API_BASE
        value: https://cubetracker-webapp.onrender.com
